<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POMOOD</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../css/pomood.css">
</head>
<body>

<div id="stage" tabindex="0" role="button" aria-label="편지 열기">

  <img id="title" src="../assets/pomood-img-10f52a7d.webp" alt="POMOOD" draggable="false">

  <div id="scene">

  <!-- 봉투 안쪽(뒷면) + 뚜껑 그림자 -->
  <div class="layer" id="back">
    <svg viewBox="0 0 1920 1080">
      <defs>
        <clipPath id="env"><rect x="550" y="478" width="820" height="462" rx="14"/></clipPath>
        <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#a6baba"/>
          <stop offset=".55" stop-color="#b9cdcc"/>
          <stop offset="1"   stop-color="#d3e9e6"/>
        </linearGradient>
      </defs>
      <g clip-path="url(#env)">
        <rect x="550" y="478" width="820" height="462" fill="var(--env-back)"/>
        <rect x="608" y="500" width="704" height="48" fill="url(#shade)"/>
      </g>
    </svg>
  </div>

  <!-- 편지지 (inputs 포함) -->
  <div id="letter">
    <div class="label">받는 사람</div>
    <h2 class="title">누구에게 쓰는 편지인가요?</h2>
    <input type="text" maxlength="12" autocomplete="off" placeholder="이름을 입력해주세요" aria-label="받는 사람 이름" tabindex="-1">
    <button type="button" tabindex="-1">편지쓰기</button>
  </div>

  <!-- 봉투 앞면: 양옆 삼각형 + 아래 주머니 -->
  <div class="layer" id="front">
    <svg viewBox="0 0 1920 1080">
      <g clip-path="url(#env)">
        <polygon fill="var(--env-side)" points="550,478 825,630 900,700 900,945 550,945"/>
        <polygon fill="var(--env-side)" points="1370,478 1095,630 1020,700 1020,945 1370,945"/>
        <polygon fill="var(--env-pocket)" stroke="var(--env-pocket)" stroke-width="10" stroke-linejoin="round"
                 points="552,946 825,634 1095,634 1368,946"/>
      </g>
    </svg>
  </div>

  <!-- 봉투 뚜껑 -->
  <div class="layer" id="flapWrap">
    <div id="flap">
      <div class="face front">
        <svg viewBox="0 0 1920 1080">
          <polygon fill="var(--flap-front)" stroke="var(--flap-front)" stroke-width="14" stroke-linejoin="round"
                   points="557,487 1363,487 960,835"/>
        </svg>
      </div>
      <div class="face back">
        <svg viewBox="0 0 1920 1080">
          <polygon fill="var(--flap-back)" stroke="var(--flap-back)" stroke-width="14" stroke-linejoin="round"
                   points="557,473 1363,473 960,125"/>
        </svg>
      </div>
    </div>
  </div>

  </div><!-- /#scene -->

  <div id="bgDark"></div>
  <div id="bg5"></div>
  <div id="bgSeal"></div>
  <div id="bgLink"></div>

  <!-- 1단계: 엽서에 내용 쓰기 -->
  <div id="page2" aria-hidden="true">
    <div id="p2-guide">1. 내용을 입력해주세요</div>
    <button id="p2-next" class="next-btn" type="button">next</button>
    <div id="postcard">
      <img src="../assets/pomood-img-d9d62f3d.webp" alt="엽서" draggable="false">
      <div id="to-name"></div>
      <textarea id="msg" rows="4" spellcheck="false" aria-label="엽서 내용"></textarea>
    </div>
  </div>

  <!-- 2단계: 우표 이미지 업로드 -->
  <div id="page3" aria-hidden="true">
    <div id="p3-guide">2. 우표를 커스텀 해주세요</div>
    <button id="p3-next" class="next-btn" type="button">next</button>
    <div id="stamp">
      <img id="stamp-base" src="../assets/pomood-img-f2774892.webp" alt="우표" draggable="false">
      <img id="stamp-photo" alt="업로드한 우표 이미지" title="클릭해서 다른 이미지로 바꾸기">
      <button id="stamp-upload" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#333" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <span>이미지 업로드</span>
      </button>
    </div>
    <input id="stamp-file" type="file" accept="image/*" hidden>
  </div>

  <!-- 3단계: 봉투 색깔 고르기 -->
  <div id="page4" aria-hidden="true">
    <div id="p4-guide">3. 봉투의 색깔을 골라주세요.</div>
    <button id="p4-next" class="next-btn" type="button">next</button>

    <div id="envgrp">
      <img id="env-img"  src="../assets/pomood-img-030b70a8.webp"  alt="봉투" draggable="false">
      <img id="env-card" src="../assets/pomood-img-fdf4e21d.webp" alt="봉투 뒷면" draggable="false">
    </div>

    <div id="swatches" role="group" aria-label="봉투 색깔">
      <button class="sw" type="button" data-color="#425676" style="--c:#425676;--i:0" aria-label="네이비"></button>
      <button class="sw" type="button" data-color="#b9cde0" style="--c:#b9cde0;--i:1" aria-label="블루"></button>
      <button class="sw" type="button" data-color="#dde9f3" style="--c:#dde9f3;--i:2" aria-label="연한 하늘색"></button>
      <button class="sw" type="button" data-color="#efefeb" style="--c:#efefeb;--i:3" aria-label="화이트"></button>
      <button class="sw" type="button" data-color="#d6c8ad" style="--c:#d6c8ad;--i:4" aria-label="베이지"></button>
    </div>

    <button id="pal-btn" type="button" aria-label="색 직접 고르기" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
    </button>

    <div id="pal-pop" role="dialog" aria-label="색 팔레트">
      <div id="pal-sv-wrap"><canvas id="pal-sv" width="524" height="344"></canvas><div id="pal-dot"></div></div>
      <input id="pal-hue" type="range" min="0" max="360" value="217" aria-label="색상">
      <div id="pal-row"><span id="pal-prev"></span><input id="pal-hex" type="text" maxlength="7" value="#425676" spellcheck="false" aria-label="색상 코드"></div>
    </div>
  </div>

  <!-- 4단계: 보내는 사람 이름 → 봉투 오른쪽 아래에 적힘 → 봉투 봉하기 -->
  <div id="page5" aria-hidden="true">
    <h2 id="p5-title">누가 보내는 편지인가요?</h2>
    <input id="p5-name" type="text" maxlength="12" autocomplete="off" placeholder="이름을 입력해주세요" aria-label="보내는 사람 이름">
    <button id="p5-seal" type="button">봉투 봉하기</button>

    <div id="env5grp">
      <div id="seal">
        <!-- 봉투 안쪽(뒷면) -->
        <div class="sl" id="sl-back">
          <svg viewBox="0 0 1920 1080">
            <defs>
              <clipPath id="sEnv"><rect x="549" y="467.5" width="819.4" height="459.5" rx="14"/></clipPath>
            </defs>
            <g clip-path="url(#sEnv)">
              <rect x="549" y="467.5" width="819.4" height="459.5" style="fill:var(--s-back)"/>
              <polygon style="fill:var(--s-shade)" points="606.7,490.6 1312.3,490.6 1094.4,626 825.6,626"/>
            </g>
          </svg>
        </div>

        <!-- 엽서 (고른 우표 + 쓴 내용) -->
        <div id="pc5">
          <img src="../assets/pomood-img-0c8cf8ce.webp" alt="엽서" draggable="false">
          <div id="pc5-name"></div>
          <div id="pc5-msg"></div>
          <div id="pc5-stamp">
            <img class="base" src="../assets/pomood-img-f2774892.webp" alt="우표" draggable="false">
            <img class="photo" id="pc5-photo" alt="">
          </div>
        </div>

        <!-- 봉투 앞면: 양옆 삼각형 + 아래 주머니 + 보내는 사람 이름 -->
        <div class="sl" id="sl-front">
          <svg viewBox="0 0 1920 1080">
            <g clip-path="url(#sEnv)">
              <polygon style="fill:var(--s-side)" points="549,467.5 825.6,619.2 900,689 900,935 549,935"/>
              <polygon style="fill:var(--s-side)" points="1368.4,467.5 1091.8,619.2 1017.4,689 1017.4,935 1368.4,935"/>
              <polygon style="fill:var(--s-pocket);stroke:var(--s-pocket)" stroke-width="10" stroke-linejoin="round"
                       points="556.3,932 825.6,624.2 1091.8,624.2 1361.1,932"/>
            </g>
          </svg>
          <div id="env5-sender" aria-hidden="true"></div>
        </div>

        <!-- 봉투 뚜껑 (열림 ↔ 닫힘) -->
        <div class="sl" id="sflapWrap">
          <div id="sflap">
            <div class="face front">
              <svg viewBox="0 0 1920 1080">
                <polygon style="fill:var(--s-flapfront);stroke:var(--s-flapfront)" stroke-width="12" stroke-linejoin="round"
                         points="555,473.5 1362.4,473.5 958.7,845.5"/>
              </svg>
            </div>
            <div class="face back">
              <svg viewBox="0 0 1920 1080">
                <polygon style="fill:var(--s-flapback);stroke:var(--s-flapback)" stroke-width="12" stroke-linejoin="round"
                         points="563.7,461.5 1353.7,461.5 958.7,113.5"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="v-hint">눌러서 열어보세요</div>
  </div>

  <!-- 5단계: 봉투가 닫히면 공유 링크 -->
  <div id="page6" aria-hidden="true">
    <div id="linkcard">
      <h3 id="lc-title">링크를 생성했어요!</h3>
      <p id="lc-sub">이 링크를 받는 사람에게 공유해주세요</p>
      <div id="lc-row">
        <input id="lc-url" type="text" readonly value="링크를 만드는 중…" aria-label="공유 링크">
        <button id="lc-copy" type="button" disabled>링크 복사</button>
      </div>
    </div>
  </div>

</div>

<!-- 봉투 색 입히기용 필터: 흑백 명암 이미지 × 선택한 색 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="envTint" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
    <feColorMatrix id="envMatrix" type="matrix" values="0.933 0 0 0 0  0 0.933 0 0 0  0 0 0.918 0 0  0 0 0 1 0"/>
  </filter>
</svg>

<script src="../js/pomood.js"></script>
</body>
</html>
